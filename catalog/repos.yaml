# Fleet manifest — one entry per child repository. Values are single tokens (no spaces, no inline comments).
#   access: write | pr-only | read-only   (read-only ⇒ workspace.sh disables the push URL)
#   product: <id>                          the docs/<product>/ this repo belongs to
# Example:
# - id: MY_API
#   path: projects/my-api
#   remote: git@github.com:org/my-api.git
#   default_branch: main
#   access: read-only
#   product: my-product
