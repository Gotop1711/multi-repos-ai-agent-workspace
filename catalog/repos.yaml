# Fleet manifest — the list of child repositories and what agents may do there.
# This is also the authorization record: repos not listed are out of scope.
#
# Parsed by workspace.sh — keep this flat one-block-per-repo shape exactly
# (`- id:` first, then two-space-indented keys).
# access: write | pr-only | read-only   (read-only ⇒ workspace.sh disables the push URL)
#
# Uncomment and edit:
#
# - id: my-service
#   path: projects/my-service
#   remote: git@github.com:org/my-service.git
#   default_branch: main
#   access: read-only
#   owner: some-team           # optional, informational only — not read by workspace.sh
#   scope: my-product          # optional — the docs/<scope>.md this repo belongs to (default: the id); single token

- id: REA_UI
  path: projects/ui
  remote: https://gitlab.transportdata.tw/nhi3rdgeneration/claimvalidator/ui.git
  default_branch: develop
  access: write
  product: rea

- id: REA_PROTO
  path: projects/rea_proto
  remote: https://gitlab.transportdata.tw/Y260607/rea_proto.git
  default_branch: feature_add-on
  access: read-only
  product: rea

- id: REA_PROTO_DATA_CREATOR
  path: projects/rea_proto_data_creator
  remote: none
  default_branch: main
  access: write
  product: rea

# A local copy of a source folder — no upstream, so `remote` is a placeholder and `clone` cannot rebuild it.
- id: REA_PROTO_BE
  path: projects/rea_proto_be
  remote: none
  default_branch: main
  access: read-only
  product: rea

- id: REA_kernel
  path: projects/kernel
  remote: https://gitlab.transportdata.tw/nhi3rdgeneration/claimvalidator/kernel.git
  default_branch: develop
  access: read-only
  product: rea
